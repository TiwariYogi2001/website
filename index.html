<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Yogesh Tiwari — Business Analyst & Data Analytics professional specializing in B2B insights, dashboards, SQL, Power BI, and Tableau." />
  <title>Yogesh Tiwari | Business Analyst & Data Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    /* ============================================================
       CSS RESET & ROOT VARIABLES
    ============================================================ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary:    #0a0f1e;
      --bg-secondary:  #0f1729;
      --bg-card:       #131d35;
      --bg-card-hover: #182040;
      --accent:        #00d4ff;
      --accent-2:      #7c3aed;
      --accent-glow:   rgba(0, 212, 255, 0.15);
      --text-primary:  #e8eaf6;
      --text-secondary:#94a3b8;
      --text-muted:    #64748b;
      --border:        rgba(0, 212, 255, 0.15);
      --border-hover:  rgba(0, 212, 255, 0.4);
      --success:       #10b981;
      --font-main:     'Poppins', sans-serif;
      --font-heading:  'Space Grotesk', sans-serif;
      --radius:        12px;
      --radius-lg:     20px;
      --shadow:        0 4px 24px rgba(0,0,0,0.4);
      --shadow-accent: 0 0 30px rgba(0, 212, 255, 0.12);
      --transition:    0.3s ease;
    }

    html { scroll-behavior: smooth; scroll-padding-top: 70px; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-main);
      font-size: 16px;
      line-height: 1.7;
      overflow-x: hidden;
    }

    /* ============================================================
       SCROLLBAR
    ============================================================ */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

    /* ============================================================
       TYPOGRAPHY UTILITIES
    ============================================================ */
    h1, h2, h3, h4 { font-family: var(--font-heading); line-height: 1.2; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    ul { list-style: none; }

    .section-label {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-glow);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 5px 16px;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .section-title span { color: var(--accent); }

    .section-subtitle {
      color: var(--text-secondary);
      max-width: 560px;
      margin-bottom: 48px;
    }

    .container { max-width: 1140px; margin: 0 auto; padding: 0 24px; }

    section { padding: 90px 0; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 26px;
      border-radius: 8px;
      font-family: var(--font-main);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      border: none;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg-primary);
    }
    .btn-primary:hover { background: #00bbdd; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,212,255,0.3); }

    .btn-outline {
      background: transparent;
      color: var(--accent);
      border: 1.5px solid var(--accent);
    }
    .btn-outline:hover { background: var(--accent-glow); transform: translateY(-2px); }

    .btn-ghost {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

    /* ============================================================
       NAVBAR
    ============================================================ */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      background: rgba(10, 15, 30, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      transition: var(--transition);
    }

    .nav-container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }
    .nav-logo span { color: var(--accent); }

    .nav-links {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .nav-links a {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 6px;
      transition: var(--transition);
    }
    .nav-links a:hover,
    .nav-links a.active { color: var(--accent); background: var(--accent-glow); }

    .nav-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 6px;
      background: none;
      border: none;
    }
    .nav-toggle span {
      display: block;
      width: 22px;
      height: 2px;
      background: var(--text-primary);
      border-radius: 2px;
      transition: var(--transition);
    }

    /* Mobile nav */
    .mobile-nav {
      display: none;
      flex-direction: column;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      padding: 16px 24px 20px;
      gap: 4px;
    }
    .mobile-nav a {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-secondary);
      padding: 10px 14px;
      border-radius: 8px;
      transition: var(--transition);
    }
    .mobile-nav a:hover { color: var(--accent); background: var(--accent-glow); }
    .mobile-nav.open { display: flex; }

    /* ============================================================
       HERO SECTION
    ============================================================ */
    #home {
      min-height: 100vh;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: 100px 0 60px;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 60% at 70% 50%, rgba(0,212,255,0.06) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 20% 30%, rgba(124,58,237,0.08) 0%, transparent 60%);
    }

    .hero-grid-lines {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .hero-container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 60px;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent-glow);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 6px 16px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .hero-badge::before {
      content: '';
      width: 8px; height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    .hero-name {
      font-size: clamp(2.6rem, 6vw, 4.2rem);
      font-weight: 800;
      line-height: 1.05;
      margin-bottom: 16px;
      letter-spacing: -1.5px;
    }
    .hero-name .first { color: var(--text-primary); }
    .hero-name .last { color: var(--accent); display: block; }

    .hero-role {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 22px;
    }
    .hero-role span { color: var(--accent); }

    .hero-desc {
      color: var(--text-secondary);
      max-width: 520px;
      font-size: 0.95rem;
      margin-bottom: 36px;
      line-height: 1.8;
    }

    .hero-cta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 40px;
    }

    .hero-socials {
      display: flex;
      gap: 12px;
    }

    .social-icon {
      width: 42px; height: 42px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 1rem;
      transition: var(--transition);
    }
    .social-icon:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-glow);
      transform: translateY(-3px);
    }

    /* Hero photo */
    .hero-photo-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-photo-ring {
      position: relative;
      width: 340px;
      height: 340px;
    }

    .hero-photo-ring::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(var(--accent), var(--accent-2), var(--accent));
      animation: spin 6s linear infinite;
      z-index: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hero-photo-inner {
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: var(--bg-primary);
      z-index: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-photo-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    /* Placeholder if no photo */
    .hero-photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-align: center;
      background: var(--bg-card);
      border-radius: 50%;
    }
    .hero-photo-placeholder i { font-size: 3.5rem; color: var(--accent); opacity: 0.4; }

    .hero-stats {
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: absolute;
      right: -20px;
      top: 50%;
      transform: translateY(-50%);
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      text-align: center;
      min-width: 90px;
      backdrop-filter: blur(10px);
    }
    .stat-card .num {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }
    .stat-card .lbl {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .hero-quote {
      margin-top: 48px;
      padding: 18px 24px;
      border-left: 3px solid var(--accent);
      background: var(--bg-card);
      border-radius: 0 var(--radius) var(--radius) 0;
      font-style: italic;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    .hero-quote strong { color: var(--text-primary); font-style: normal; }

    /* ============================================================
       ABOUT SECTION
    ============================================================ */
    #about { background: var(--bg-secondary); }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: start;
    }

    .about-text p {
      color: var(--text-secondary);
      margin-bottom: 16px;
      font-size: 0.95rem;
      line-height: 1.85;
    }

    .about-highlights {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 28px;
    }

    .highlight-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .highlight-item i { color: var(--accent); font-size: 0.9rem; }

    .about-info-cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .info-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: var(--transition);
    }
    .info-card:hover { border-color: var(--border-hover); box-shadow: var(--shadow-accent); }

    .info-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .info-card-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: var(--accent-glow);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 1rem;
    }
    .info-card h4 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    .info-card p {
      font-size: 0.84rem;
      color: var(--text-secondary);
    }

    .about-cta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    /* ============================================================
       SKILLS SECTION
    ============================================================ */
    #skills { background: var(--bg-primary); }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .skill-category {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      transition: var(--transition);
    }
    .skill-category:hover { border-color: var(--border-hover); box-shadow: var(--shadow-accent); transform: translateY(-4px); }

    .skill-cat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }
    .skill-cat-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--accent-glow);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent);
      font-size: 1.1rem;
    }
    .skill-cat-header h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .skill-tag {
      background: rgba(0,212,255,0.06);
      border: 1px solid rgba(0,212,255,0.18);
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 6px;
      transition: var(--transition);
    }
    .skill-tag:hover { background: var(--accent-glow); color: var(--accent); border-color: var(--accent); }
    .skill-tag.primary { background: var(--accent-glow); color: var(--accent); border-color: var(--border-hover); }

    .skill-bar-list { display: flex; flex-direction: column; gap: 10px; }

    .skill-bar-item {}
    .skill-bar-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }
    .skill-bar-track {
      height: 5px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      overflow: hidden;
    }
    .skill-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 3px;
      width: 0;
      transition: width 1.2s ease;
    }

    .methods-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .method-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-secondary);
      padding: 6px 0;
    }
    .method-item i { color: var(--accent); font-size: 0.7rem; }

    /* ============================================================
       BACKGROUND SECTION (Timeline)
    ============================================================ */
    #background { background: var(--bg-secondary); }

    .bg-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
    }

    .timeline-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .timeline-title i { font-size: 1rem; }

    .timeline {
      position: relative;
      padding-left: 28px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 8px; top: 0; bottom: 0;
      width: 1.5px;
      background: linear-gradient(to bottom, var(--accent), transparent);
    }

    .timeline-item {
      position: relative;
      margin-bottom: 28px;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -24px;
      top: 6px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(0,212,255,0.6);
    }

    .tl-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      transition: var(--transition);
    }
    .tl-card:hover { border-color: var(--border-hover); transform: translateX(4px); }

    .tl-org {
      font-size: 0.78rem;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .tl-role {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .tl-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tl-date i { font-size: 0.7rem; }
    .tl-desc {
      font-size: 0.84rem;
      color: var(--text-secondary);
      line-height: 1.7;
    }
    .tl-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .tl-tool {
      font-size: 0.7rem;
      background: rgba(0,212,255,0.06);
      border: 1px solid rgba(0,212,255,0.15);
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* ============================================================
       PROJECTS SECTION
    ============================================================ */
    #projects { background: var(--bg-primary); }

    .projects-filter {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 36px;
    }
    .filter-btn {
      padding: 7px 18px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-main);
    }
    .filter-btn:hover,
    .filter-btn.active {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: var(--accent);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px;
    }

    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
    }
    .project-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-6px);
      box-shadow: 0 16px 48px rgba(0,0,0,0.4);
    }

    .project-thumb {
      height: 180px;
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .project-thumb-icon {
      font-size: 3rem;
      color: var(--accent);
      opacity: 0.25;
    }

    .project-thumb-num {
      position: absolute;
      top: 14px;
      left: 18px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.1em;
      background: var(--accent-glow);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 4px;
    }

    .project-badge {
      position: absolute;
      top: 14px;
      right: 18px;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 4px;
    }
    .badge-sql    { background: rgba(124,58,237,0.2); color: #a78bfa; border: 1px solid rgba(124,58,237,0.3); }
    .badge-powerbi{ background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.25); }
    .badge-tableau{ background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.25); }
    .badge-excel  { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.25); }
    .badge-python { background: rgba(0,212,255,0.12);  color: var(--accent); border: 1px solid var(--border); }
    .badge-vr     { background: rgba(244,63,94,0.15);  color: #fb7185; border: 1px solid rgba(244,63,94,0.25); }
    .badge-game   { background: rgba(251,146,60,0.15); color: #fb923c; border: 1px solid rgba(251,146,60,0.25); }

    /* Color-coded thumb backgrounds */
    .thumb-1 { background: linear-gradient(135deg, #0f172a, #1e293b); }
    .thumb-2 { background: linear-gradient(135deg, #0f1a2e, #1a1040); }
    .thumb-3 { background: linear-gradient(135deg, #0f1a1a, #0a2a1a); }
    .thumb-4 { background: linear-gradient(135deg, #1a0f1a, #0f0f2a); }
    .thumb-5 { background: linear-gradient(135deg, #1a0f0f, #0f1a0f); }
    .thumb-6 { background: linear-gradient(135deg, #0f1a10, #1a180f); }

    .project-body {
      padding: 22px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .project-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 10px;
      line-height: 1.35;
    }

    .project-desc {
      font-size: 0.83rem;
      color: var(--text-secondary);
      line-height: 1.75;
      margin-bottom: 16px;
      flex: 1;
    }

    .project-actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }
    .project-actions .btn { font-size: 0.8rem; padding: 9px 16px; }

    /* ============================================================
       ACHIEVEMENTS SECTION
    ============================================================ */
    #achievement { background: var(--bg-secondary); }

    .achievements-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .ach-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .ach-card:hover { border-color: var(--border-hover); transform: translateY(-4px); box-shadow: var(--shadow-accent); }

    .ach-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: var(--accent-glow);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent);
      font-size: 1.4rem;
      margin-bottom: 18px;
    }

    .ach-card h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .ach-org {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 10px;
    }
    .ach-desc {
      font-size: 0.83rem;
      color: var(--text-secondary);
      line-height: 1.7;
      flex: 1;
      margin-bottom: 18px;
    }

    /* ============================================================
       CONTACT SECTION
    ============================================================ */
    #contact { background: var(--bg-primary); }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 48px;
      align-items: start;
    }

    .contact-info { display: flex; flex-direction: column; gap: 16px; }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      transition: var(--transition);
    }
    .contact-item:hover { border-color: var(--border-hover); }

    .contact-item-icon {
      width: 42px; height: 42px;
      border-radius: 10px;
      background: var(--accent-glow);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent);
      font-size: 1rem;
      flex-shrink: 0;
    }

    .contact-item-text { display: flex; flex-direction: column; }
    .contact-item-label { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
    .contact-item-value { font-size: 0.9rem; color: var(--text-primary); font-weight: 500; margin-top: 2px; }

    .contact-socials {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    /* Contact form */
    .contact-form-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 36px;
    }

    .contact-form-card h3 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: var(--text-primary);
    }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    .form-group:last-of-type { margin-bottom: 0; }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: var(--font-main);
      font-size: 0.88rem;
      padding: 12px 16px;
      transition: var(--transition);
      outline: none;
      width: 100%;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
    }
    .form-group textarea { resize: vertical; min-height: 120px; }
    .form-group input::placeholder,
    .form-group textarea::placeholder { color: var(--text-muted); }

    .form-submit { margin-top: 20px; width: 100%; justify-content: center; font-size: 0.95rem; padding: 14px; }

    .form-success {
      display: none;
      text-align: center;
      padding: 20px;
      color: var(--success);
      font-size: 0.9rem;
    }
    .form-success i { font-size: 2rem; display: block; margin-bottom: 8px; }

    /* ============================================================
       FOOTER
    ============================================================ */
    footer {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      padding: 32px 0;
    }

    .footer-inner {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
